# Not a monorepo — `packages` is only here so pnpm <10.5.0 accepts this
# settings file instead of failing with "packages field missing or empty".
packages:
  - '.'

onlyBuiltDependencies:
  - better-sqlite3
  - core-js
  - esbuild
  - protobufjs
  - sharp
allowBuilds:
  '@firebase/util': true
  better-sqlite3: true
  core-js: true
  esbuild: true
  protobufjs: true
  sharp: true
  workerd: true
minimumReleaseAgeExclude:
  - '@astrojs/cloudflare@14.3.3'
  - '@astrojs/markdown-satteri@0.4.2'
  - '@astrojs/mdx@8.0.2'
  - '@astrojs/vercel@11.0.11'
  - astro@7.3.4
  - '@astrojs/react@7.0.0'
